<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffd43b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Пушистая жизнь — большая жизнь маленького хомячка</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐹</text></svg>">
  <script>
    // Запуск игры с метками версий (docs/ARCHITECTURE.md, «Выкладка и метки версий»). Номер сборки BUILD читается
    // из js/data/build.js мимо кэша; по списку js/modules.json строится карта импортов: каждый модуль грузится
    // как «файл.js?v=BUILD». Новая сборка — новые адреса: браузер не смешает старые и новые файлы из кэша.
    // Читаем синхронно (два маленьких файла) и вписываем теги прямо в страницу — стили и модули грузятся так же,
    // как обычные теги в разметке. Не получилось узнать номер — игра запускается как раньше, без меток.
    (function () {
      var doc = document;
      function read(url) {
        var x = new XMLHttpRequest();
        x.open('GET', url + '?t=' + Date.now(), false);
        x.send();
        if (x.status !== 200) throw new Error(url);
        return x.responseText;
      }
      function tags(q, map) {
        doc.write(
          '<link rel="stylesheet" href="css/style.css' + q + '">' +
            (map ? '<script type="importmap">' + map + '<\/script>' : '') +
            '<script type="module" src="js/main.js' + q + '"><\/script>',
        );
      }
      var v, files;
      try {
        v = /BUILD\s*=\s*(\d+)/.exec(read('js/data/build.js'))[1];
        files = JSON.parse(read('js/modules.json'));
      } catch (e) {
        return tags('');
      }
      if (HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')) {
        var imports = {};
        files.forEach(function (f) {
          var u = new URL(f, doc.baseURI).href;
          imports[u] = u + '?v=' + v;
        });
        return tags('?v=' + v, JSON.stringify({ imports: imports }).replace(/</g, '\\u003c'));
      }
      // Старый браузер без карты импортов (Safari до 16.4): при новой сборке один раз перечитываем все файлы
      // с сервера — кэш браузера обновляется целиком, и игра грузится по обычным адресам.
      var seen = null;
      try {
        seen = localStorage.getItem('rhr-build-seen');
      } catch (e) {}
      if (seen === v || !window.fetch) return tags('');
      var start = function () {
        try {
          localStorage.setItem('rhr-build-seen', v);
        } catch (e) {}
        var css = doc.createElement('link'),
          js = doc.createElement('script');
        css.rel = 'stylesheet';
        css.href = 'css/style.css';
        js.type = 'module';
        js.src = 'js/main.js';
        css.onload = css.onerror = function () {
          doc.body.appendChild(js); // игра меряет экран по стилям — сначала стили, потом код
        };
        doc.head.appendChild(css);
      };
      Promise.all(
        files.concat('css/style.css').map(function (f) {
          return fetch(f, { cache: 'reload' }).then(function (r) {
            return r.text();
          });
        }),
      ).then(start, start);
    })();
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <noscript>Для игры нужен JavaScript.</noscript>
</body>
</html>
