<!doctype html><meta charset="utf-8"><title>Вся мебель</title><body style="margin:0;background:#ffe3b3;font:12px sans-serif">
<canvas id="c"></canvas>
<script type="module">
// Страница для разработки: показывает каждый предмет мебели из каталога в настоящем размере.
// ?from=N — начать с N-го предмета; ?on=1 — «потроганные» и включённые; ?t=1.3 — момент анимации.
import { drawFurn } from '../js/art/furniture.js';
import { drawHamster } from '../js/art/hamster.js';
import { FURNITURE, defaultLook } from '../js/data/index.js';
const q = new URLSearchParams(location.search), from = +(q.get('from') || 0);
const items = FURNITURE.slice(from), cols = 7, cw = 250, chh = 270;
const cv = document.getElementById('c'); cv.width = cols * cw; cv.height = Math.ceil(items.length / cols) * chh;
const ctx = cv.getContext('2d');
items.forEach((it, i) => {
  const x = (i % cols) * cw + cw / 2, y = Math.floor(i / cols) * chh + 236;
  ctx.fillStyle = '#c98b5a'; ctx.fillRect(x - cw / 2, y, cw, 6);
  drawFurn(ctx, it, x, it.wall ? y - 140 : y, { t: +(q.get('t') || 0.4), on: q.get('on') ? true : undefined, minutes: 600 });
  ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.font = '12px sans-serif'; ctx.fillText(`${it.name} · ${it.price}`, x, y + 22);
});
// хомячок для масштаба
drawHamster(ctx, 60, 236, 1.45, defaultLook(), { time: 1 });
</script>
